<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Rosé | Login</title>
    <link rel="stylesheet" href="Rose.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
</head>

<body>

<div class="page">

    <div class="left">

        <div class="logo">
            <div class="icon"><img src="rose-seal-transparent.png" alt="Rosé" class="seal-img"></div>
            <span class="logo-text">Rosé</span>
        </div>

        <p class="tagline">Skincare made for you</p>

        <div class="headline-row">
            <h1>
                Your skin is <i>unique.</i><br>
                Your data should<br>
                be <i>too.</i>
            </h1>
        </div>

        <p class="text">
            Tell us your skin type and concerns. We will build a routine that fits your life
            and keeps the things that work.
        </p>

    </div>


    <div class="right">

        <div class="login">

            <p class="login-kicker">MEMBER LOGIN</p>

            <h2>Welcome <i>to</i></h2>

            <p class="subtext">Log in to continue your personalized<br>skincare analysis</p>

            <form>

                <label for="email">Email address</label>
                <div class="input-wrap">
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>

                <label for="password">Password</label>
                <div class="input-wrap">
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="login-btn">Log In</button>

                <button type="button" class="guest-btn">
                    Continue as Guest
                </button>

                <div class="forgot">
                    <a href="#">Forgot password?</a>
                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
